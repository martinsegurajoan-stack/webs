<!doctype html><html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box} body{width:1080px;height:1920px;overflow:hidden;font-family:Inter}
#root{position:relative;width:1080px;height:1920px;background:radial-gradient(120% 80% at 50% 45%, #3a3f48 0%, #23272e 55%, #15181d 100%)}
#gl{position:absolute;inset:0}
.sub{position:absolute;left:70px;right:70px;top:250px;text-align:center;font:600 58px/1.22 Inter;color:rgba(255,255,255,0.42);text-shadow:0 2px 10px rgba(0,0,0,0.5)}
.sub b{color:#fff;font-weight:600} .sub i{font-style:normal;color:#fff;border:3px solid #4ea3ff;border-radius:6px;background:rgba(78,163,255,0.18);padding:0 6px}
svg.lin{position:absolute;inset:0}
.lab{position:absolute;color:#fff;font-family:Inter}
.lab small{display:block;font:700 18px Inter;letter-spacing:5px;color:#4fd1ff;margin-bottom:6px}
.lab b{display:block;font:600 40px/1.15 Inter;letter-spacing:-0.5px}
.lab em{display:block;font-style:normal;font:500 24px/1.3 Inter;color:rgba(255,255,255,0.7);margin-top:6px}
.dato{position:absolute;left:0;right:0;text-align:center;color:#fff}
.dato b{display:block;font:300 150px/1 Inter;letter-spacing:-6px} .dato small{display:block;margin-top:8px;font:600 22px Inter;letter-spacing:8px;color:rgba(255,255,255,0.65)}
#marca{position:absolute;left:0;right:0;top:1820px;text-align:center;font:600 26px Inter;color:#fff;opacity:0.28}
</style></head><body><div id="root"><div id="gl"></div>
<div class="sub" id="sub"></div><svg class="lin" width="1080" height="1920"><path id="l1" stroke="#4fd1ff" stroke-width="2" fill="none"/><circle id="c1" r="7" fill="#4fd1ff"/><circle id="c2" r="16" fill="none" stroke="#4fd1ff" stroke-width="2" opacity="0.6"/></svg>
<div class="lab" id="lab"></div><div class="dato" id="dato"></div><div id="marca">@mundo.supuesto</div></div>
<script src="assets/three.min.js"></script><script src="escena2.js"></script>
<script>
const E = window.ESC, f = +(location.hash.slice(1) || 1);
const $ = id => document.getElementById(id);
function etiqueta(p3, lx, ly, html) {
  const [x, y] = E.proyecta(p3); $('c1').setAttribute('cx', x); $('c1').setAttribute('cy', y); $('c2').setAttribute('cx', x); $('c2').setAttribute('cy', y);
  $('l1').setAttribute('d', `M${x},${y} L${lx},${ly + 30}`); const l = $('lab'); l.style.left = lx + 'px'; l.style.top = ly + 'px'; l.innerHTML = html;
}
if (f === 1) {
  E.cam.position.set(-1250, 520, 1250); E.cam.lookAt(80, 40, -40);
  $('sub').innerHTML = '<b>Mil</b> <b>metros</b> <b>de</b> <b>mar…</b> <i>y</i> ni una columna';
  $('dato').style.top = '1450px'; $('dato').innerHTML = '<b>1.000 m</b><small>SIN APOYOS EN EL AGUA</small>';
  E.render();
} else if (f === 2) {
  E.aguaMat.opacity = 0.22; E.sup.material.opacity = 0.15;
  E.cam.position.set(-260, -40, 520); E.cam.lookAt(-E.TX, -60, 0);
  const r = E.resalta([E.cimientos[0]]); r.set(1);
  E.render();
  $('sub').innerHTML = '<b>Bajo</b> <b>el</b> <b>agua,</b> <i>cada</i> torre se apoya';
  etiqueta(new THREE.Vector3(-E.TX + 40, -E.PROF - 20, 30), 600, 1250, '<small>CIMENTACIÓN</small><b>Cajón de hormigón</b><em>Hundido hasta la roca,<br>bajo la arena del fondo</em>');
} else {
  E.cam.position.set(-330, 330, 260); E.cam.lookAt(-E.TX, 190, 0);
  const r = E.resalta(E.arcos.slice(0, 2)); r.set(1);
  E.render();
  $('sub').innerHTML = '<b>Arriba,</b> <b>la</b> <b>torre</b> <b>se</b> <i>abre</i> en arcos';
  etiqueta(new THREE.Vector3(-E.TX, 200, 22), 620, 1300, '<small>LA TORRE</small><b>Arcos huecos</b><em>Menos peso y menos<br>superficie contra el viento</em>');
}
</script></body></html>
