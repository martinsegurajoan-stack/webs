<style>

<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="%%DUR%%" data-width="1080" data-height="1920">
  <img class="tex" id="tDia" src="%%TDIA%%"><img class="tex" id="tNoche" src="%%TNOCHE%%"><img class="tex" id="tNubes" src="%%TNUBES%%"><img class="tex" id="tMar" src="%%TMAR%%">

</div>
<script>
const fmt = (v, d) => { const s = v.toFixed(d).split("."); return s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (s[1] ? "," + s[1] : ""); };
const S = { t:0, W:0, va:1, lon:-28, lat:18, sc:440, sol:55, olas:0, swell:0, swellA:0, olor:0, olorV:1, vuelos:0, vueloA:0, vueloB:0, chorro:0, maiz:0, maizG:0, smog:0, latl:0, oeste:0, seco:0, humedad:0, polvo:0, bodele:0, bio:0, hur:0, solar:0, espejo:0, pulso:0, hielo:0, amaz:0, amazF:0, bodP:0, celdas:0, hoja:0, pol:0, lluviaS:0, arbol:0 };
const LABS = [], LV = {};
// ---------------- planeta 3D (texturas NASA)
const glc = document.getElementById("gl");
const R3 = new THREE.WebGLRenderer({ canvas: glc, antialias: true, alpha: true, preserveDrawingBuffer: true });
R3.setPixelRatio(1); R3.setSize(1080, 1920, false); R3.setClearColor(0x000000, 0);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(28, 1080 / 1920, 0.01, 100);
const outer = new THREE.Group(), inner = new THREE.Group(); outer.add(inner); scene.add(outer);
const VACIA = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1); VACIA.needsUpdate = true;
const TXI = { dia:"tDia", noche:"tNoche", nubes:"tNubes", mar:"tMar" }; let TXOK = false;
function texListas() { if (TXOK) return true; for (const k in TXI) { const im = document.getElementById(TXI[k]); if (!(im.complete && im.naturalWidth > 0)) return false; }
  for (const k in TXI) { const t = new THREE.Texture(document.getElementById(TXI[k])); t.anisotropy = 8; t.wrapS = THREE.RepeatWrapping; t.needsUpdate = true; TX[k] = t; }
  U.dia.value = TX.dia; U.noche.value = TX.noche; U.mar.value = TX.mar; UN.nubes.value = TX.nubes; TXOK = true; return true; }
const TX = { dia: VACIA, noche: VACIA, nubes: VACIA, mar: VACIA };
const U = { dia:{value:TX.dia}, noche:{value:TX.noche}, mar:{value:TX.mar}, sol:{value:new THREE.Vector3(1,0,0)}, seco:{value:0}, espejo:{value:0}, humoP:{value:new THREE.Vector3(0,0,1)}, humo:{value:0} };
const VS = `varying vec2 vUv; varying vec3 vN; varying vec3 vP; void main(){ vUv = uv; vN = normalize(mat3(modelMatrix) * normal); vec4 w = modelMatrix * vec4(position,1.0); vP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`;
const tierra = new THREE.Mesh(new THREE.SphereGeometry(1, 160, 160), new THREE.ShaderMaterial({ uniforms: U, vertexShader: VS, fragmentShader: `
  uniform sampler2D dia, noche, mar; uniform vec3 sol, humoP; uniform float seco, espejo, humo; varying vec2 vUv; varying vec3 vN; varying vec3 vP;
  void main(){ vec3 N = normalize(vN), L = normalize(sol), V = normalize(cameraPosition - vP);
    float d = dot(N, L); float day = smoothstep(-0.12, 0.22, d);
    vec3 c = texture2D(dia, vUv).rgb; float oc = texture2D(mar, vUv).r;
    float g = c.g - max(c.r, c.b); vec3 arena = vec3(0.80, 0.63, 0.40) * (0.55 + 0.7 * dot(c, vec3(0.333)));
    c = mix(c, arena, seco * (1.0 - oc) * (0.55 + 0.4 * smoothstep(-0.05, 0.08, g + 0.06)));
    vec3 lit = c * (0.30 + 0.85 * max(d, 0.0));
    vec3 luces = texture2D(noche, vUv).rgb * vec3(1.0, 0.82, 0.55) * 0.9 * (1.0 - day);
    float h = humo * smoothstep(0.12, 0.0, distance(normalize(vP), humoP)); luces *= (1.0 - 0.85 * h); lit = mix(lit, vec3(0.32, 0.27, 0.2) * (0.25 + max(d, 0.0)), h * 0.6);
    vec3 H = normalize(L + V); float sh = mix(30.0, 900.0, espejo); float sp = pow(max(dot(N, H), 0.0), sh) * oc * mix(0.4, 1.15, espejo) * step(0.0, d);
    float fr = pow(1.0 - max(dot(N, V), 0.0), 2.6);
    vec3 atm = vec3(0.32, 0.58, 1.0) * fr * (0.15 + 0.95 * day);
    gl_FragColor = vec4(lit + luces + vec3(1.0, 0.97, 0.9) * sp + atm, 1.0); }` }));
inner.add(tierra);
const UN = { nubes:{value:TX.nubes}, sol:U.sol, off:{value:0}, op:{value:0.0} };
const nubes = new THREE.Mesh(new THREE.SphereGeometry(1.007, 160, 160), new THREE.ShaderMaterial({ uniforms: UN, transparent: true, depthWrite: false, vertexShader: VS, fragmentShader: `
  uniform sampler2D nubes; uniform vec3 sol; uniform float off, op; varying vec2 vUv; varying vec3 vN; varying vec3 vP;
  void main(){ float a = texture2D(nubes, vec2(vUv.x + off, vUv.y)).r; float d = dot(normalize(vN), normalize(sol));
    vec3 c = vec3(1.0) * (0.05 + 1.0 * max(d, 0.0)) + vec3(1.0, 0.55, 0.35) * 0.35 * smoothstep(0.25, 0.0, abs(d)) * step(0.0, d + 0.1);
    gl_FragColor = vec4(c, a * op * smoothstep(-0.12, 0.2, d)); }` }));
inner.add(nubes);
const atmo = new THREE.Mesh(new THREE.SphereGeometry(1.085, 96, 96), new THREE.ShaderMaterial({ uniforms: { sol: U.sol }, side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  vertexShader: `varying vec3 vN; varying vec3 vP; void main(){ vN = normalize(mat3(modelMatrix) * normal); vec4 w = modelMatrix * vec4(position,1.0); vP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform vec3 sol; varying vec3 vN; varying vec3 vP; void main(){ vec3 V = normalize(cameraPosition - vP); float i = pow(max(0.0, 0.62 + dot(normalize(vN), V)), 3.2); float d = dot(-normalize(vN), normalize(sol));
    gl_FragColor = vec4(vec3(0.35, 0.62, 1.0) * i * (0.35 + 0.9 * smoothstep(-0.3, 0.4, d)), i); }` }));
scene.add(atmo);
function vec(lon, lat, r) { const ph = (lon + 180) * Math.PI / 180, th = (90 - lat) * Math.PI / 180; return new THREE.Vector3(-Math.cos(ph) * Math.sin(th) * r, Math.cos(th) * r, Math.sin(ph) * Math.sin(th) * r); }
// ---------------- capa 2D (datos)
const cv = document.getElementById("cv"), g = cv.getContext("2d");
const CAMP = new THREE.Vector3(), _v = new THREE.Vector3(), _n = new THREE.Vector3();
let MW = new THREE.Matrix4();
function P3(lon, lat, alt) { _v.copy(vec(lon, lat, 1 + (alt || 0))).applyMatrix4(MW); _n.copy(_v).normalize(); const vis = _n.dot(CAMP.clone().sub(_v)) > 0; const s = _v.clone().project(camera); return [(s.x + 1) * 540, (1 - s.y) * 960, vis]; }
function glow(x, y, r, col, a) { if (a <= 0.001) return; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col.replace("A", a)); gr.addColorStop(1, col.replace("A", 0)); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
function trazo(coords, alt, col, w, dash) { g.strokeStyle = col; g.lineWidth = w; if (dash) g.setLineDash(dash); g.beginPath(); let ok = 0; for (const c of coords) { const p = P3(c[0], c[1], alt); if (!p[2]) { ok = 0; continue; } if (ok) g.lineTo(p[0], p[1]); else g.moveTo(p[0], p[1]); ok = 1; } g.stroke(); g.setLineDash([]); }
function relleno(coords, alt, col) { g.fillStyle = col; g.beginPath(); let n = 0; for (const c of coords) { const p = P3(c[0], c[1], alt); if (n) g.lineTo(p[0], p[1]); else g.moveTo(p[0], p[1]); n++; } g.closePath(); g.fill(); }
function rnd(i) { const x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); }
const N = 1100, SEED = [];
for (let i = 0; i < N; i++) { const u = rnd(i + 1), v = rnd(i + 7.3); SEED.push([u * 360 - 180, Math.asin(2 * v - 1) * 180 / Math.PI, rnd(i + 3.1) * %%LV%%]); }
function campo(lon, lat) { const p = lat * Math.PI / 180, l = lon * Math.PI / 180;
  const u = -7.5 * Math.cos(6 * p) * (0.75 + 0.25 * Math.cos(p)) + 2.6 * Math.sin(3 * l + 2 * p) + 1.6 * Math.cos(5 * l - 3 * p);
  const v = 2.4 * Math.sin(6 * p) * Math.cos(2 * l) + 2.2 * Math.sin(4 * l + p * 3) - 1.2 * Math.cos(3 * l - 2 * p); return [u / Math.max(0.25, Math.cos(p)), v]; }
function particulas() { const dt = 0.1; g.lineCap = "round"; g.globalCompositeOperation = "lighter";
  for (let i = 0; i < N; i++) { const sd = SEED[i]; const age = ((S.W + sd[2]) % %%LV%% + %%LV%%) % %%LV%%;
    let lon = sd[0], lat = sd[1]; const n = Math.floor(age / dt); const tr = [];
    for (let k = 0; k < n; k++) { const f = campo(lon, lat); lon += f[0] * dt; lat = Math.max(-85, Math.min(85, lat + f[1] * dt)); if (k >= n - 7) tr.push([lon, lat]); }
    if (tr.length < 2) continue; const vida = Math.sin(Math.PI * age / %%LV%%);
    g.beginPath(); let ok = 0; for (const q of tr) { const p = P3(q[0], q[1], 0.012); if (!p[2]) { ok = 0; continue; } if (ok) g.lineTo(p[0], p[1]); else g.moveTo(p[0], p[1]); ok = 1; }
    g.strokeStyle = `rgba(235,248,255,${(0.6 * vida * S.va).toFixed(3)})`; g.lineWidth = 2.4; g.stroke(); }
  g.globalCompositeOperation = "source-over"; }
function poli(c) { return c; }
const NY = [-74, 40.7], LON = [-0.1, 51.5], BOD = [18, 17], AMA = [-62, -3], STORM = [-165, -55], BIO = [-110.85, 32.58], MAD = [-3.7, 40.4];
const AMZ = [[-79,-2],[-77,2],[-72,3],[-67,4],[-62,4],[-58,3],[-54,1],[-50,-1],[-49,-4],[-52,-8],[-55,-12],[-60,-14],[-65,-15],[-69,-14],[-72,-12],[-75,-9],[-77,-6]];
const BODP = [[16,16.2],[17.2,15.6],[18.7,16.2],[19.2,17.3],[18.1,18.2],[16.5,17.8]];
const MAIZ = [[-92, 41.5, 6], [-97, 38, 4], [-52, -20, 4], [-61, -33, 3.5], [-100, 20, 3]];
const HUR = [[-60, 18], [-78, 25], [-45, 15]];
const CELDAS = [[[-60,5],[-20,22],[20,28]], [[60,-5],[20,-22],[-20,-28]], [[-80,35],[-40,48],[0,58]], [[80,-35],[40,-48],[0,-58]]];
const UKP = []; for (const f of UKIE.features) { const gm = f.geometry; const polys = gm.type === "Polygon" ? [gm.coordinates] : gm.coordinates; for (const p of polys) if (p[0].length > 30) UKP.push(p[0]); }
function frame() {
  const t = S.t, wv = 2 * Math.PI * t / %%DURX%%;
  const lon = S.lon + 1.6 * Math.sin(3 * wv), lat = S.lat + 0.8 * Math.sin(2 * wv);
  const dist = Math.max(2.15, 3940 / S.sc) * (1 - 0.02 * Math.sin(4 * wv));
  inner.rotation.y = Math.atan2(Math.cos((lon + 180) * Math.PI / 180), Math.sin((lon + 180) * Math.PI / 180));
  outer.rotation.x = lat * Math.PI / 180;
  camera.position.set(0, 0, dist); camera.lookAt(0, 0, 0); camera.updateMatrixWorld(); outer.updateMatrixWorld(true);
  MW.copy(inner.matrixWorld); CAMP.copy(camera.position);
  const a = S.sol * Math.PI / 180; U.sol.value.set(Math.sin(a), 0.25, Math.cos(a)).normalize();
  U.seco.value = S.seco; U.espejo.value = S.espejo; UN.off.value = S.W * 0.0045;
  U.humo.value = S.smog; U.humoP.value.copy(vec(LON[0], LON[1], 1)).applyMatrix4(MW).normalize();
  texListas(); R3.render(scene, camera);
  document.getElementById("cielo").style.transform = `translate(${(-S.lon * 0.6).toFixed(1)}px, ${(S.lat * 0.6).toFixed(1)}px)`;
  g.clearRect(0, 0, 1080, 1920);
  const C = (q) => P3(q[0], q[1], 0);
  // pulso del parón
  if (S.pulso > 0.01 && S.pulso < 0.999) { const p = C([lon, lat]); g.strokeStyle = `rgba(159,220,255,${(0.7 * (1 - S.pulso)).toFixed(3)})`; g.lineWidth = 3; g.beginPath(); g.arc(540, 960, (420 + 420 * S.pulso), 0, 7); g.stroke(); }
  // humedad
  if (S.humedad > 0.01 || S.lluviaS > 0.01) for (let k = 0; k < 60; k++) { const la = -35 + (k % 12) * 6, lo0 = -45 + ((t * 2.2 + k * 1.7) % 22) * (1 - 0.7 * (1 - S.lluviaS));
      const p = P3(lo0, la, 0.02), q = P3(lo0 + 3.5, la + 0.6, 0.02); if (!p[2] || !q[2]) continue; g.strokeStyle = `rgba(150,215,255,${(0.6 * Math.max(S.humedad, S.lluviaS)).toFixed(3)})`; g.lineWidth = 3; g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); g.stroke(); }
  particulas();
  // hojas: el bosque europeo «tiembla» con viento y se queda quieto
  if (S.hoja > 0.01) { const m = Math.max(0, Math.min(1, 1 - (t - %%HOJA%%) / 1.6)); g.globalCompositeOperation = "lighter";
      for (let k = 0; k < 90; k++) { const lo = -4 + rnd(k + 40) * 36, la = 44 + rnd(k + 90) * 18; const p = P3(lo, la, 0.004); if (!p[2]) continue;
        const an = 0.6 * Math.sin(t * 9 + k * 1.7) * m + rnd(k) * 3, L = 7 + rnd(k + 5) * 6; g.strokeStyle = `rgba(170,240,150,${(0.65 * S.hoja * (0.4 + 0.6 * m)).toFixed(3)})`; g.lineWidth = 2.2;
        g.beginPath(); g.moveTo(p[0] - Math.cos(an) * L, p[1] - Math.sin(an) * L); g.lineTo(p[0] + Math.cos(an) * L, p[1] + Math.sin(an) * L); g.stroke(); }
      g.globalCompositeOperation = "source-over"; }
  // oleaje
  if (S.olas > 0.01) for (let k = 0; k < 14; k++) { const r = ((t * 0.9 + k * 1.3) % 18) + 2; trazo(d3.geoCircle().center([-150 + (k % 3) * 25 - 25, -30 + (k % 4) * 9]).radius(r)().coordinates[0], 0.004, `rgba(210,240,255,${(0.45 * S.olas * (1 - r / 20)).toFixed(3)})`, 2); }
  if (S.swellA > 0.01) { for (let k = 0; k < 7; k++) { const r = Math.max(0.5, S.swell * 118 - k * 6); trazo(d3.geoCircle().center(STORM).radius(r)().coordinates[0], 0.004, `rgba(170,230,255,${(0.6 * S.swellA * (1 - k / 7)).toFixed(3)})`, 2.5); }
    const ps = C(STORM); if (ps[2]) glow(ps[0], ps[1], 80, "rgba(220,240,255,A)", 0.6 * S.swellA); }
  // olor a pan
  if (S.olor > 0.01) { const p = C(MAD); if (p[2]) { g.save(); g.translate(p[0], p[1]); g.globalAlpha = S.olor; const L = 380 * S.olorV + 26 * (1 - S.olorV), Wd = 60 * S.olorV + 26 * (1 - S.olorV);
      const gg = g.createRadialGradient(0, 0, 0, L * 0.45, 0, L); gg.addColorStop(0, "rgba(255,205,130,0.8)"); gg.addColorStop(1, "rgba(255,205,130,0)"); g.fillStyle = gg; g.beginPath(); g.ellipse(L * 0.45 * S.olorV, 0, L * 0.55 + 14, Wd, 0, 0, 7); g.fill();
      for (let k = 0; k < 26; k++) { const u = ((t * 0.6 + k / 26) % 1); g.fillStyle = `rgba(255,220,160,${(0.8 * (1 - u)).toFixed(2)})`; g.beginPath(); g.arc(u * L * S.olorV + 10 * Math.sin(k), Math.sin(k * 2.3) * Wd * u, 2.5, 0, 7); g.fill(); }
      g.restore(); } }
  // vuelos
  if (S.chorro > 0.01) { g.globalCompositeOperation = "lighter"; for (let k = 0; k < 80; k++) { const u = ((t * 0.25 + k / 80) % 1), lo = -80 + u * 85, la = 44 + 6 * Math.sin(u * 5 + k) + (k % 5) - 2; const p = P3(lo, la, 0.01), q = P3(lo + 4, la + 0.4, 0.01);
      if (!p[2] || !q[2]) continue; g.strokeStyle = `rgba(255,180,90,${(0.5 * S.chorro * Math.sin(Math.PI * u)).toFixed(3)})`; g.lineWidth = 2.5; g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); g.stroke(); } g.globalCompositeOperation = "source-over"; }
  if (S.vuelos > 0.01) { const ip = d3.geoInterpolate(NY, LON); const pts = d3.range(0, 1.001, 0.02).map(ip); const alt = (u) => 0.035 * Math.sin(Math.PI * u);
      g.strokeStyle = `rgba(255,255,255,${(0.55 * S.vuelos).toFixed(3)})`; g.lineWidth = 2; g.setLineDash([6, 9]); g.beginPath(); pts.forEach((q, k) => { const p = P3(q[0], q[1], alt(k / 50)); if (k) g.lineTo(p[0], p[1]); else g.moveTo(p[0], p[1]); }); g.stroke(); g.setLineDash([]);
      let f = null; if (S.vueloB > 0) f = 1 - S.vueloB; else if (S.vueloA > 0) f = S.vueloA;
