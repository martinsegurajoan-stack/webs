<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body>
<script type="module">
import * as THREE from './three.module.min.js';
import { RoomEnvironment } from './RoomEnvironment.js';
import { RoundedBoxGeometry } from './RoundedBoxGeometry.js';
import { crearPersonaje, poser } from './personaje.js';

const W = 720, H = 1280;
const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.setSize(W, H);
R.outputColorSpace = THREE.SRGBColorSpace;
R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 0.82;
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(R.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(R);
scene.environment = pmrem.fromScene(new RoomEnvironment(R), 0.04).texture;
scene.environmentIntensity = 0.55;
const FLOOR = -3.7;
scene.fog = new THREE.Fog(0xf3c9a8, 18, 60);

// ---------------------------------------------------------------- texturas pintadas
function canvasTex(w, h, draw, rep = [1, 1]) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); return t;
}
function rnd(a, b) { return a + Math.random() * (b - a); }
Math.random = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();  // determinista

const cielo = canvasTex(512, 1024, (g, w, h) => {
  const lg = g.createLinearGradient(0, 0, 0, h);
  lg.addColorStop(0, '#5b8fd6'); lg.addColorStop(0.45, '#9fc3ec'); lg.addColorStop(0.62, '#f7d2b0'); lg.addColorStop(1, '#f2a678');
  g.fillStyle = lg; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 40; i++) { const x = rnd(0, w), y = rnd(100, 500), r = rnd(30, 90);
    const rg = g.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, 'rgba(255,255,255,0.35)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = rg; g.fillRect(x - r, y - r, 2 * r, 2 * r); }
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(80, 48, 32), new THREE.MeshBasicMaterial({ map: cielo, side: THREE.BackSide, fog: false }));
scene.add(sky);

function fachadaTex(base, ventana, pisos, cols) {
  return canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2500; i++) { g.fillStyle = `rgba(0,0,0,${rnd(0, 0.04)})`; g.fillRect(rnd(0, w), rnd(0, h), 3, 3); }
    const cw = w / cols, ch = h / pisos;
    for (let r = 0; r < pisos; r++) for (let c = 0; c < cols; c++) {
      const x = c * cw + cw * 0.22, y = r * ch + ch * 0.2, ww = cw * 0.56, hh = ch * 0.55;
      g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(x - 4, y - 4, ww + 8, hh + 12);
      const lit = Math.random() < 0.25;
      const lg = g.createLinearGradient(x, y, x + ww, y + hh);
      lg.addColorStop(0, lit ? '#ffe7a8' : ventana); lg.addColorStop(1, lit ? '#f7b860' : '#20324a');
      g.fillStyle = lg; g.fillRect(x, y, ww, hh);
      g.fillStyle = 'rgba(255,255,255,0.8)'; g.fillRect(x - 6, y + hh, ww + 12, 6);   // alféizar
      g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 3; g.strokeRect(x, y, ww, hh);
      g.beginPath(); g.moveTo(x + ww / 2, y); g.lineTo(x + ww / 2, y + hh); g.stroke();
    }
  });
}
const asfalto = canvasTex(256, 1024, (g, w, h) => {
  g.fillStyle = '#4a4a52'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 6000; i++) { g.fillStyle = `rgba(255,255,255,${rnd(0, 0.06)})`; g.fillRect(rnd(0, w), rnd(0, h), 2, 2); }
  g.fillStyle = '#f2f2f2'; for (let y = 0; y < h; y += 128) g.fillRect(w / 2 - 5, y, 10, 70);
}, [1, 6]);
const baldosa = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#cfc6bb'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#a99f94'; g.lineWidth = 3;
  for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(0, i * 64); g.lineTo(w, i * 64); g.stroke(); g.beginPath(); g.moveTo(i * 64, 0); g.lineTo(i * 64, h); g.stroke(); }
}, [4, 30]);

// ---------------------------------------------------------------- calle
const street = new THREE.Group(); scene.add(street);
const road = new THREE.Mesh(new THREE.PlaneGeometry(8, 120), new THREE.MeshStandardMaterial({ map: asfalto, roughness: 0.9 }));
road.rotation.x = -Math.PI / 2; road.position.set(0, FLOOR - 0.3, -30); road.receiveShadow = true; street.add(road);
for (const s of [-1, 1]) {
  const walk = new THREE.Mesh(new THREE.BoxGeometry(6, 0.3, 120), new THREE.MeshStandardMaterial({ map: baldosa, roughness: 0.85 }));
  walk.position.set(s * 7, FLOOR - 0.15, -30); walk.receiveShadow = true; street.add(walk);
}
const colores = ['#e8a87c', '#f2d0a4', '#c38d9e', '#9fc1b5', '#f4e1c1', '#d98a6f', '#b9a7d6'];
for (const s of [-1, 1]) for (let k = 0; k < 9; k++) {
  const hgt = rnd(10, 18), wid = rnd(6, 8.5);
  const tex = fachadaTex(colores[(k * 3 + (s > 0 ? 2 : 0)) % colores.length], '#6c8fb5', Math.round(hgt / 2.6), 3);
  const m = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 });
  const b = new THREE.Mesh(new THREE.BoxGeometry(5, hgt, wid), m);
  b.position.set(s * 12.5, FLOOR + hgt / 2, 6 - k * (wid + 0.4)); b.castShadow = b.receiveShadow = true; street.add(b);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(5.4, 0.5, wid + 0.3), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 }));
  roof.position.set(s * 12.5, FLOOR + hgt + 0.25, b.position.z); street.add(roof);
}
function arbol(x, z) {
  const g = new THREE.Group(); g.position.set(x, FLOOR, z); street.add(g);
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.28, 3.2, 12), new THREE.MeshStandardMaterial({ color: 0x6b4a32, roughness: 1 }));
  tr.position.y = 1.6; tr.castShadow = true; g.add(tr);
  const leaf = new THREE.MeshStandardMaterial({ color: 0x5fae4c, roughness: 0.8 });
  for (let i = 0; i < 5; i++) { const f = new THREE.Mesh(new THREE.IcosahedronGeometry(rnd(1.1, 1.6), 2), leaf);
    f.position.set(rnd(-0.8, 0.8), rnd(3.6, 4.8), rnd(-0.8, 0.8)); f.castShadow = true; g.add(f); }
  return g;
}
function farola(x, z) {
  const g = new THREE.Group(); g.position.set(x, FLOOR, z); street.add(g);
  const m = new THREE.MeshStandardMaterial({ color: 0x2c3340, roughness: 0.5, metalness: 0.6 });
  const p = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.14, 6, 12), m); p.position.y = 3; p.castShadow = true; g.add(p);
  const l = new THREE.Mesh(new THREE.SphereGeometry(0.35, 20, 14), new THREE.MeshStandardMaterial({ color: 0xfff1c8, emissive: 0xffd27a, emissiveIntensity: 0.8 }));
  l.position.y = 6.2; g.add(l);
}
for (let k = 0; k < 7; k++) { arbol(-4.6, 2 - k * 9); arbol(4.6, -8 - k * 9); farola(-4.5, -2.5 - k * 9); farola(4.5, 2 - k * 9); }

// ---------------------------------------------------------------- portal (plano A)
const portal = new THREE.Group(); scene.add(portal);
const facade = new THREE.Mesh(new THREE.BoxGeometry(14, 14, 1), new THREE.MeshStandardMaterial({ map: fachadaTex('#e9b48c', '#6c8fb5', 4, 4), roughness: 0.9 }));
facade.position.set(0, FLOOR + 7, -4.6); facade.receiveShadow = true; portal.add(facade);
const hueco = new THREE.Mesh(new THREE.BoxGeometry(2.2, 5.6, 1.05), new THREE.MeshBasicMaterial({ color: 0x1a120e }));
hueco.position.set(0, FLOOR + 2.8, -4.58); portal.add(hueco);
const marco = new THREE.MeshStandardMaterial({ color: 0xf5efe6, roughness: 0.5 });
for (const [x, y, w, h] of [[-1.25, 2.9, 0.3, 5.9], [1.25, 2.9, 0.3, 5.9], [0, 5.85, 2.8, 0.3]]) {
  const f = new THREE.Mesh(new THREE.BoxGeometry(w, h, 1.2), marco); f.position.set(x, FLOOR + y, -4.5); f.castShadow = true; portal.add(f);
}
const hinge = new THREE.Group(); hinge.position.set(-1.1, FLOOR, -4.02); portal.add(hinge);
const puertaMat = new THREE.MeshPhysicalMaterial({ color: 0x2f7d6b, roughness: 0.45, clearcoat: 0.4 });
const door = new THREE.Mesh(new RoundedBoxGeometry(2.2, 5.6, 0.16, 3, 0.04), puertaMat);
door.position.set(1.1, 2.8, 0); door.castShadow = true; hinge.add(door);
for (const y of [1.5, 4.0]) { const pan = new THREE.Mesh(new RoundedBoxGeometry(1.5, 1.8, 0.08, 2, 0.03), puertaMat);
  pan.position.set(1.1, y, 0.1); hinge.add(pan); }
const pomo = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 12), new THREE.MeshStandardMaterial({ color: 0xd9b24a, metalness: 0.9, roughness: 0.25 }));
pomo.position.set(1.9, 2.7, 0.15); hinge.add(pomo);
const step = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.25, 1.2), new THREE.MeshStandardMaterial({ color: 0xbdb3a6, roughness: 0.9 }));
step.position.set(0, FLOOR + 0.12, -3.6); step.receiveShadow = true; portal.add(step);
const suelo = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ map: baldosa, roughness: 0.85 }));
suelo.rotation.x = -Math.PI / 2; suelo.position.y = FLOOR; suelo.receiveShadow = true; portal.add(suelo);
const maceta = (x) => { const g = new THREE.Group(); g.position.set(x, FLOOR, -3.7); portal.add(g);
  const p = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.38, 0.9, 20), new THREE.MeshStandardMaterial({ color: 0xc8623e, roughness: 0.8 }));
  p.position.y = 0.45; p.castShadow = true; g.add(p);
  for (let i = 0; i < 4; i++) { const b = new THREE.Mesh(new THREE.IcosahedronGeometry(0.45, 1), new THREE.MeshStandardMaterial({ color: 0x4f9d48 }));
    b.position.set(rnd(-0.3, 0.3), 1.2 + rnd(0, 0.4), rnd(-0.3, 0.3)); b.castShadow = true; g.add(b); } };
maceta(-2.4); maceta(2.4);

// mechón atrapado en la puerta
const hairTex = canvasTex(64, 512, (g, w, h) => { g.fillStyle = '#3b2417'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 80; i++) { g.strokeStyle = `hsla(24,45%,${rnd(18, 45)}%,0.6)`; g.lineWidth = rnd(1, 3); const x = rnd(0, w); g.beginPath(); g.moveTo(x, 0); g.lineTo(x + rnd(-4, 4), h); g.stroke(); } });
const atrapado = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshPhysicalMaterial({ map: hairTex, roughness: 0.5, sheen: 0.8, sheenColor: new THREE.Color(0x8a5a3a) }));
atrapado.castShadow = true; scene.add(atrapado);

// ---------------------------------------------------------------- luces
const sun = new THREE.DirectionalLight(0xffd6ae, 2.6);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 4; sun.shadow.bias = -0.0004;
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 60 });
scene.add(sun); scene.add(sun.target);
scene.add(new THREE.HemisphereLight(0xa9c6ff, 0x7a5a44, 0.7));
const rim = new THREE.DirectionalLight(0xffb37a, 1.4); scene.add(rim);

const pj = crearPersonaje(); scene.add(pj);
pj.traverse(o => { if (o.isMesh) { o.castShadow = true; } });

// partículas: hojas/polen flotando en la luz
const N = 120, arr = new Float32Array(N * 3); for (let i = 0; i < N; i++) { arr[i * 3] = rnd(-8, 8); arr[i * 3 + 1] = rnd(-3, 6); arr[i * 3 + 2] = rnd(-20, 6); }
const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(arr, 3));
const dot = canvasTex(64, 64, (g) => { const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, 'rgba(255,240,210,1)'); r.addColorStop(1, 'rgba(255,240,210,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); });
const motes = new THREE.Points(pg, new THREE.PointsMaterial({ size: 0.09, map: dot, transparent: true, opacity: 0.7, depthWrite: false, blending: THREE.AdditiveBlending }));
scene.add(motes);

const cam = new THREE.PerspectiveCamera(32, W / H, 0.1, 200);
const ease = x => x < 0 ? 0 : x > 1 ? 1 : 0.5 - 0.5 * Math.cos(Math.PI * x);
const lerp = (a, b, k) => a + (b - a) * k;
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// ---------------------------------------------------------------- guion de la muestra (10 s)
window.DUR = 10.0;
window.frame = (t) => {
  let shake = 0;
  const A = t < 4.6;
  portal.visible = A; street.visible = !A; atrapado.visible = false;
  if (A) {
    // PLANO A: sale del portal, la puerta se cierra y le pilla la melena
    scene.fog.near = 30;
    sun.position.set(6, 10, 8); sun.target.position.set(0, FLOOR, -2);
    rim.position.set(-6, 4, -10);
    const open = ease(t / 0.7) * (1 - ease((t - 2.35) / 0.35));
    hinge.rotation.y = -1.65 * open;
    const wk = Math.min(1, Math.max(0, (t - 0.35) / 2.3));
    let z = lerp(-5.2, 0.4, wk);
    let tiron = 0, cara = 'normal', andar = t > 0.35 && t < 2.75 ? 1 : 0;
    if (t >= 2.75) {                          // ¡tirón!
      const k = t - 2.75;
      tiron = Math.max(0, Math.sin(Math.min(k, 0.35) / 0.35 * Math.PI / 2)) * (0.75 + 0.25 * Math.sin(k * 9) * Math.exp(-k));
      z = 0.4 - 0.25 * tiron;
      cara = k < 0.7 ? 'sorprendido' : 'agobiado';
      if (k > 0.9) { andar = 0.6; tiron = 0.6 + 0.3 * Math.abs(Math.sin(k * 6)); }  // tira para soltarse
      shake = 0.06 * Math.exp(-k * 5) * Math.sin(k * 70);
    }
    pj.position.set(0, 0, z); pj.rotation.y = 0;
    poser(pj, { cm: 75, t, cara, puntas: 0.8, andar, paso: t * 7.5, viento: 0.15 * andar, tiron });
    if (t >= 2.55) {                          // mechón tenso desde la nuca hasta la puerta
      const head = pj.userData.head;
      head.updateMatrixWorld(true);
      const a = head.localToWorld(V(0.05, -0.35, -0.62));
      const b = V(0.95, FLOOR + 2.6, -4.05);
      const sag = Math.max(0, 0.25 - tiron * 0.3);
      const curve = new THREE.QuadraticBezierCurve3(a, V((a.x + b.x) / 2, (a.y + b.y) / 2 - sag, (a.z + b.z) / 2), b);
      atrapado.geometry.dispose();
      atrapado.geometry = new THREE.TubeGeometry(curve, 40, 0.16 - 0.05 * tiron, 12, false);
      atrapado.visible = true;
    }
    // cámara: travelling de espaldas que acompaña y luego empuje al primer plano
    const k1 = ease((t - 0.2) / 2.6), k2 = ease((t - 2.9) / 1.6);
    cam.position.set(lerp(3.2, 2.0, k1) + lerp(0, -0.6, k2), lerp(-0.6, -0.3, k1) + shake, lerp(7.5, 8.2, k1) - k2 * 3.2);
    cam.fov = lerp(34, 30, k2);
    cam.lookAt(lerp(0, 0.2, k1), lerp(-1.6, -0.2, k2), lerp(-2.5, 0, k1) + shake);
  } else {
    // PLANO B: camina por la calle; cámara delante que retrocede y gira alrededor
    const tb = t - 4.6;
    scene.fog.near = 18;
    pj.position.set(7.4 + 0.08 * Math.sin(tb), 0, -6 + tb * 1.9);   // por la acera, hacia la cámara
    pj.rotation.y = 0;
    poser(pj, { cm: 75, t, cara: tb < 2.5 ? 'agobiado' : 'pensativo', puntas: 0.9, andar: 1, paso: t * 7.2, viento: 0.6 });
    sun.position.set(pj.position.x + 8, 9, pj.position.z - 6); sun.target.position.copy(pj.position);
    rim.position.set(pj.position.x - 4, 3, pj.position.z - 8);
    const orb = lerp(-0.3, 0.22, ease(tb / 5.4));
    const dist = lerp(9.5, 7.2, ease(tb / 5.4));
    cam.position.set(pj.position.x + Math.sin(orb) * dist, lerp(-1.2, -2.4, ease(tb / 5.4)), pj.position.z + Math.cos(orb) * dist);
    cam.fov = 32;
    cam.lookAt(pj.position.x, pj.position.y - 1.6, pj.position.z);
  }
  cam.updateProjectionMatrix();
  motes.position.y = (t * 0.15) % 2; motes.rotation.y = t * 0.02;
  R.render(scene, cam);
  return true;
};
window.ok = true;
</script>
</body></html>
